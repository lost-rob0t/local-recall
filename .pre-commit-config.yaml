repos:
  - repo: local
    hooks:
      - id: repository-policy
        name: repository policy
        entry: ./scripts/check-policy
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format check
        entry: uv run --no-sync ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright strict
        entry: uv run --no-sync pyright
        language: system
        pass_filenames: false
      - id: detect-secrets
        name: detect secrets
        entry: uv run --no-sync detect-secrets-hook --baseline .secrets.baseline
        language: system
