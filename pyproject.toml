[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-recall"
version = "0.1.0.dev0"
description = "Local-first encrypted desktop activity recall"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "lost-rob0t" }]
dependencies = [
  "pydantic>=2.11,<3",
  "pykka>=4.4,<5",
  "pynacl>=1.6.2,<2",
  "pyzmq>=27,<28",
  "typer>=0.16,<1",
]

[project.scripts]
local-recall = "local_recall.cli:app"

[dependency-groups]
dev = [
  "bandit[toml]>=1.8,<2",
  "detect-secrets>=1.5,<2",
  "hypothesis>=6.135,<7",
  "pre-commit>=4.2,<5",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<9",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
  "shellcheck-py>=0.10,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_recall"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
timeout = 10
timeout_method = "thread"
markers = [
  "contract: strategy and transport contract tests",
  "integration: multi-component integration tests",
  "security: privacy and security invariant tests",
  "e2e: end-to-end acceptance tests",
  "failure_injection: test-harness failure propagation tests",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
exclude = ["tests/failure_fixtures"]
reportMissingTypeStubs = "none"

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
