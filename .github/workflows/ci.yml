name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-diagnostics:
    name: Format diagnostic (${{ matrix.file }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        file:
          - src/local_recall/config/inspection.py
          - src/local_recall/config/models.py
          - src/local_recall/crypto/__init__.py
          - src/local_recall/crypto/bindings.py
          - src/local_recall/crypto/codec.py
          - src/local_recall/crypto/envelope.py
          - src/local_recall/crypto/errors.py
          - src/local_recall/crypto/gpg.py
          - src/local_recall/crypto/keyring.py
          - src/local_recall/crypto/processor.py
          - src/local_recall/crypto/registry.py
          - src/local_recall/domain/__init__.py
          - src/local_recall/domain/crypto.py
          - src/local_recall/ports/__init__.py
          - src/local_recall/ports/keys.py
          - tests/contract/test_reusable_suites.py
          - tests/integration/test_encryption_stage.py
          - tests/unit/config/test_encryption_settings.py
          - tests/unit/crypto/test_envelope.py
          - tests/unit/crypto/test_gpg_and_registry.py
          - tests/unit/crypto/test_keyring.py
          - tests/unit/domain/test_crypto.py
          - tests/unit/ports/test_all_protocols.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Check selected formatting
        run: uv run --no-sync ruff format --check ${{ matrix.file }}

  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Check Python lint
        run: uv run --no-sync ruff check .
      - name: Check shell scripts
        run: uv run --no-sync shellcheck scripts/bootstrap scripts/check scripts/test scripts/run-pytest scripts/security-scan
      - name: Check static types
        run: uv run --no-sync pyright
      - name: Run unit tests
        run: ./scripts/run-pytest tests/unit
      - name: Run contract tests
        run: ./scripts/run-pytest tests/contract
      - name: Run integration tests
        run: ./scripts/run-pytest tests/integration
      - name: Run security tests
        run: ./scripts/run-pytest tests/security
      - name: Run security checks
        run: ./scripts/security-scan

  failure-propagation:
    name: Failure propagation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Verify known failures remain non-zero
        run: ./scripts/verify-failure-modes
