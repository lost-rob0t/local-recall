name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Check Python lint
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          target = "tests/integration/pipeline/test_in_memory_pipeline.py"
          completed = subprocess.run(
              ["uv", "run", "--no-sync", "ruff", "check", "--fix", "--diff", target],
              capture_output=True,
              text=True,
              check=False,
          )
          output = completed.stdout + completed.stderr
          Path("ruff-canonical-diff.txt").write_text(output, encoding="utf-8")
          print(output, end="")
          raise SystemExit(1 if output else completed.returncode)
          PY
      - name: Upload canonical Ruff diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-canonical-diff-${{ matrix.os }}
          path: ruff-canonical-diff.txt
          if-no-files-found: error
      - name: Check shell scripts
        run: uv run --no-sync shellcheck scripts/bootstrap scripts/check scripts/test scripts/run-pytest scripts/security-scan
      - name: Check static types
        run: uv run --no-sync pyright
      - name: Run unit tests
        run: ./scripts/run-pytest tests/unit
      - name: Run contract tests
        run: ./scripts/run-pytest tests/contract
      - name: Run integration tests
        run: ./scripts/run-pytest tests/integration
      - name: Run security tests
        run: ./scripts/run-pytest tests/security
      - name: Run security checks
        run: ./scripts/security-scan

  failure-propagation:
    name: Failure propagation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Verify known failures remain non-zero
        run: ./scripts/verify-failure-modes
