name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyright-diagnostic:
    name: Capture Pyright diagnostics
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Capture strict type diagnostics
        run: |
          if uv run --no-sync pyright > .ci-pyright.txt 2>&1; then
            status=0
          else
            status=$?
          fi
          printf '\nexit_status=%s\n' "$status" >> .ci-pyright.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-pyright.txt
          git commit -m "Capture Pyright diagnostics"
          git push origin HEAD:${{ github.head_ref }}

  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Check Python lint
        run: uv run --no-sync ruff check .
      - name: Check shell scripts
        run: uv run --no-sync shellcheck scripts/bootstrap scripts/check scripts/test scripts/run-pytest scripts/security-scan
      - name: Check static types
        run: uv run --no-sync pyright
      - name: Run unit tests
        run: ./scripts/run-pytest tests/unit
      - name: Run contract tests
        run: ./scripts/run-pytest tests/contract
      - name: Run integration tests
        run: ./scripts/run-pytest tests/integration
      - name: Run security tests
        run: ./scripts/run-pytest tests/security
      - name: Run security checks
        run: ./scripts/security-scan

  failure-propagation:
    name: Failure propagation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Verify known failures remain non-zero
        run: ./scripts/verify-failure-modes
