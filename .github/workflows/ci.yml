name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-diagnostics:
    name: Format diagnostic (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: config
            paths: src/local_recall/config tests/unit/config
          - group: crypto-source
            paths: src/local_recall/crypto src/local_recall/domain/crypto.py src/local_recall/ports/keys.py src/local_recall/domain/__init__.py src/local_recall/ports/__init__.py
          - group: crypto-tests
            paths: tests/unit/crypto tests/integration/test_encryption_stage.py tests/unit/domain/test_crypto.py tests/unit/ports/test_all_protocols.py tests/contract/test_reusable_suites.py
          - group: remaining
            paths: src tests scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Check selected formatting
        run: uv run --no-sync ruff format --check ${{ matrix.paths }}

  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Check Python lint
        run: uv run --no-sync ruff check .
      - name: Check shell scripts
        run: uv run --no-sync shellcheck scripts/bootstrap scripts/check scripts/test scripts/run-pytest scripts/security-scan
      - name: Check static types
        run: uv run --no-sync pyright
      - name: Run unit tests
        run: ./scripts/run-pytest tests/unit
      - name: Run contract tests
        run: ./scripts/run-pytest tests/contract
      - name: Run integration tests
        run: ./scripts/run-pytest tests/integration
      - name: Run security tests
        run: ./scripts/run-pytest tests/security
      - name: Run security checks
        run: ./scripts/security-scan

  failure-propagation:
    name: Failure propagation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Verify known failures remain non-zero
        run: ./scripts/verify-failure-modes
