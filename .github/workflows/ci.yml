name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-autofix:
    name: Canonical current GPG formatting
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Apply pinned Ruff formatting
        run: |
          uv run --no-sync ruff format src/local_recall/crypto/gpg.py tests/unit/crypto/test_gpg_and_registry.py
          if git diff --quiet; then
            echo "Formatting already canonical"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/local_recall/crypto/gpg.py tests/unit/crypto/test_gpg_and_registry.py
            git commit -m "Apply canonical current GPG formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi

  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Check Python lint
        run: uv run --no-sync ruff check .
      - name: Check shell scripts
        run: uv run --no-sync shellcheck scripts/bootstrap scripts/check scripts/test scripts/run-pytest scripts/security-scan
      - name: Check static types
        run: uv run --no-sync pyright
      - name: Run unit tests
        run: ./scripts/run-pytest tests/unit
      - name: Run contract tests
        run: ./scripts/run-pytest tests/contract
      - name: Run integration tests
        run: ./scripts/run-pytest tests/integration
      - name: Run security tests
        run: ./scripts/run-pytest tests/security
      - name: Check repository policy
        run: ./scripts/check-policy
      - name: Run Bandit
        run: uv run --no-sync bandit --quiet --recursive src
      - name: Scan tracked files for secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' tracked_files < <(git ls-files -z)
          uv run --no-sync detect-secrets-hook --baseline .secrets.baseline "${tracked_files[@]}"

  failure-propagation:
    name: Failure propagation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Verify known failures remain non-zero
        run: ./scripts/verify-failure-modes
