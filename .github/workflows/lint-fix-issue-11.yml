name: Capture issue 11 lint diagnostic

on:
  push:
    branches:
      - agent/issue-11-storage-catalog

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-11-storage-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/bootstrap
      - run: uv run --no-sync ruff check . --output-format=concise > lint-diagnostic.txt || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-diagnostic.txt
          git commit -m "Capture issue 11 lint diagnostic"
          git push origin HEAD:agent/issue-11-storage-catalog
