name: Issue 16 formatter artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-artifact:
    if: github.event.pull_request.number == 68
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: ./scripts/bootstrap
      - name: Format issue branch
        run: uv run --no-sync ruff format .
      - name: Package formatted tree
        run: |
          tar -czf /tmp/issue16-formatted.tar.gz \
            src/local_recall/config \
            src/local_recall/metadata \
            src/local_recall/session \
            tests/unit/metadata \
            tests/unit/session \
            tests/contract \
            tests/integration/pipeline \
            tests/security \
            docs
      - uses: actions/upload-artifact@v4
        with:
          name: issue16-formatted
          path: /tmp/issue16-formatted.tar.gz
          if-no-files-found: error
          retention-days: 1
