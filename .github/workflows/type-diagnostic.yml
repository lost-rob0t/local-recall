name: Issue 11 type diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch pull request merge ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD
      - name: Install type-check dependencies
        run: |
          python -m pip install --quiet \
            pyright==1.1.411 \
            'pydantic>=2.11,<3' \
            'pynacl>=1.6.2,<2' \
            'pykka>=4.4,<5' \
            'pyzmq>=27,<28' \
            'typer>=0.16,<1'
      - name: Run strict Pyright
        run: pyright
