name: Issue 11 lint diagnostic

on:
  push:
    branches:
      - agent/issue-11-storage-catalog

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Run concise Ruff diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch agent/issue-11-storage-catalog "https://x-access-token:${GH_TOKEN}@github.com/lost-rob0t/local-recall.git" repo
          cd repo
          python -m pip install --quiet ruff==0.15.22
          ruff check . --output-format=concise
